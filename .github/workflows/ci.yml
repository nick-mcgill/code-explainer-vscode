name: CI & Quality Gates

on:
  push:
      branches: [ main, develop ]
        pull_request:
            branches: [ main, develop ]

            jobs:
              build-and-test:
                  name: Build & Test (${{ matrix.os }})
                      runs-on: ${{ matrix.os }}
                          strategy:
                                fail-fast: false
                                      matrix:
                                              os: [ubuntu-latest, windows-latest, macos-latest]

                                                  steps:
                                                        - name: Checkout Code
                                                                uses: actions/checkout@v4

                                                                      - name: Setup Node.js
                                                                              uses: actions/setup-node@v4
                                                                                      with:
                                                                                                node-version: '20'
                                                                                                          cache: 'npm'

                                                                                                                - name: Install Dependencies
                                                                                                                        run: npm ci

                                                                                                                              - name: Run ESLint & Type Check
                                                                                                                                      run: |
                                                                                                                                                npm run compile

                                                                                                                                                      - name: Run Extension Tests & Code Coverage
                                                                                                                                                              uses: coactions/setup-xvfb@v1
                                                                                                                                                                      with:
                                                                                                                                                                                run: npm run test:coverage

                                                                                                                                                                                      - name: Verify Bundle Size (< 250 KB)
                                                                                                                                                                                              if: runner.os == 'Linux'
                                                                                                                                                                                                      run: |
                                                                                                                                                                                                                npm run package
                                                                                                                                                                                                                          BUNDLE_SIZE=$(stat -c%s "dist/extension.js")
                                                                                                                                                                                                                                    MAX_SIZE=256000 # 250 KB in bytes
                                                                                                                                                                                                                                              echo "Bundle size: $BUNDLE_SIZE bytes"
                                                                                                                                                                                                                                                        if [ $BUNDLE_SIZE -gt $MAX_SIZE ]; then
                                                                                                                                                                                                                                                                    echo "::error::Bundle size ($BUNDLE_SIZE bytes) exceeds limit of 250KB ($MAX_SIZE bytes)!"
                                                                                                                                                                                                                                                                                exit 1
                                                                                                                                                                                                                                                                                          fi

                                                                                                                                                                                                                                                                                                - name: Upload Coverage Reports
                                                                                                                                                                                                                                                                                                        if: runner.os == 'Linux'
                                                                                                                                                                                                                                                                                                                uses: actions/upload-artifact@v4
                                                                                                                                                                                                                                                                                                                        with:
                                                                                                                                                                                                                                                                                                                                  name: coverage-report
                                                                                                                                                                                                                                                                                                                                            path: coverage/
                                                                                                                                                                                                                                                                                                                                            